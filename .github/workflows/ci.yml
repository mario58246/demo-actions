# - Push o Pull Request hacia main: ejecuta pruebas y construye la imagen Docker.
# - Push a main: además publica la imagen en GitHub Container Registry (GHCR).
name: CI/CD Django
 
# 1. EVENTOS: cuándo se ejecuta el workflow
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
 
jobs:
  # 2. JOB DE PRUEBAS (Integración Continua)
  test:
    runs-on: ubuntu-latest
    env:
      # Valores de prueba; NUNCA pongan aquí claves reales del proyecto
      DJANGO_SECRET_KEY: clave-solo-para-pruebas
      DJANGO_DEBUG: "True"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip            # acelera las siguientes ejecuciones
 
      - name: Instalar dependencias
        run: pip install -r requirements.txt
 
      - name: Ejecutar pruebas
        run: python manage.py test
 
  # 3. JOB DE IMAGEN DOCKER (Entrega Continua)
  # Corre en push y en PR, pero solo si las pruebas pasaron
  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      # true solo cuando es un push a main (no en PR ni en otras ramas)
      PUBLICAR: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    permissions:
      contents: read
      packages: write           # permiso para publicar en GHCR
    steps:
      - uses: actions/checkout@v4
 
      - name: Iniciar sesión en GitHub Container Registry
        if: env.PUBLICAR == 'true'     # en un PR no hace falta iniciar sesión
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # secret automático
 
      - name: Generar nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
 
      - name: Construir la imagen (y publicarla solo desde main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLICAR == 'true' }}   # PR: build; main: build+push
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
